name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  deploy-dev:
    name: Deploy to dev
    needs: verify
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (dev)
        working-directory: packages/worker
        run: pnpm exec wrangler d1 migrations apply zuulpass-dev --remote --env dev

      - name: Deploy (dev)
        working-directory: packages/worker
        run: pnpm exec wrangler deploy --env dev

      - name: Set PEPPER secret (dev)
        working-directory: packages/worker
        env:
          PEPPER: ${{ secrets.PEPPER }}
        run: printf '%s' "$PEPPER" | pnpm exec wrangler secret put PEPPER --env dev

  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (prod)
        working-directory: packages/worker
        run: pnpm exec wrangler d1 migrations apply zuulpass-prod --remote --env prod

      - name: Deploy (prod)
        working-directory: packages/worker
        run: pnpm exec wrangler deploy --env prod

      - name: Set PEPPER secret (prod)
        working-directory: packages/worker
        env:
          PEPPER: ${{ secrets.PEPPER }}
        run: printf '%s' "$PEPPER" | pnpm exec wrangler secret put PEPPER --env prod
